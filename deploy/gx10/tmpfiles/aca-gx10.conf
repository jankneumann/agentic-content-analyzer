# Directories a unit needs before its first command runs. systemd-tmpfiles-setup
# applies this early in every boot; `make install` applies it at once.
#
# /run is a tmpfs, so everything under it is gone after a reboot. A unit that
# names a missing path in ReadWritePaths= fails namespace setup (226/NAMESPACE)
# before ExecStart.
d /run/aca                           0755 root root -
d /run/aca/gx10                      0700 root root -
# systemd opens StandardOutput=append: files BEFORE it creates StateDirectory=,
# so a log file inside a state directory needs that directory to exist already.
# Without this the restore drill failed every run from first install.
d /var/lib/aca                       0755 root root -
d /var/lib/aca/gx10                  0700 root root -
d /var/lib/aca/gx10/restore-evidence 0700 root root -
