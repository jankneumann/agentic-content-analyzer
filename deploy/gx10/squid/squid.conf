# GX-10 CONNECT-only egress policy. Default deny MUST remain last.
# Runs unprivileged as the image's proxy user on a read-only root; /run is
# not writable, so the pid file lives on the bounded /tmp tmpfs.
pid_filename /tmp/squid.pid
http_port 3128
visible_hostname aca-gx10-squid

acl CONNECT method CONNECT
acl SSL_ports port 443
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
auth_param basic program /usr/lib/squid/basic_ncsa_auth /run/aca/gx10/proxy/squid.passwd
auth_param basic realm aca-gx10-egress
acl authenticated proxy_auth REQUIRED

# Never disclose client addresses or requested URLs in the CONNECT log.
forwarded_for delete
request_header_access X-Forwarded-For deny all
logformat gx10_connect time=%ts.%03tu host=masked port=443 status=%>Hs bytes=%<st duration_ms=%tr
access_log stdio:/var/log/squid/connect.log gx10_connect

request_timeout 30 seconds
connect_timeout 10 seconds
read_timeout 30 seconds
negative_dns_ttl 10 seconds
positive_dns_ttl 300 seconds
shutdown_lifetime 5 seconds

http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow authenticated allowed_domains SSL_ports CONNECT
http_access deny all
