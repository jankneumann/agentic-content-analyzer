# Railway Deployment Profile — FalkorDB variant
# ==============================================
# Layers the FalkorDB graph backend onto the shared `railway` profile.
# Sibling to `railway-neo4j.yaml`; neither is the implicit default — callers
# pick explicitly via `PROFILE=railway-falkordb` or `PROFILE=railway-neo4j`.
# Current production deployment uses this profile.
#
# Railway services needed:
#   1. App service (this repo)
#   2. FalkorDB service (falkordb/falkordb:v4.4.1 Docker image)
#   3. MinIO service (optional, for file storage)
#
# Environment variables to set on Railway:
#   - FALKORDB_HOST (internal Railway hostname of FalkorDB service)
#   - FALKORDB_PORT (default: 6379)
#   - FALKORDB_PASSWORD (if auth enabled)
#
# Usage:
#   Set PROFILE=railway-falkordb in Railway service variables.

name: railway-falkordb
extends: railway
description: Railway.app deployment with FalkorDB graph backend

providers:
  graphdb: falkordb
  neo4j: local  # leftover legacy field; with graphdb=falkordb the validator skips AuraDB checks

settings:
  graphdb:
    falkordb_cloud_host: ${FALKORDB_HOST}
    falkordb_cloud_port: ${FALKORDB_PORT:-6379}
    falkordb_cloud_password: ${FALKORDB_PASSWORD:-}
    falkordb_database: ${FALKORDB_DATABASE:-newsletter_graph}
