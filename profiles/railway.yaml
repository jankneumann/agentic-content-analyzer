# Railway Deployment Profile — Shared Base
# =========================================
# Railway.app deployment settings with sensible defaults. Compose with
# overlay profiles to pick the graph backend; this profile defaults to
# ParadeDB-on-Railway for the relational DB.
#
# Two orthogonal choice axes:
#
#   Relational DB (Postgres):
#     - Default (this profile):           ParadeDB on Railway
#                                         (image: ghcr.io/jankneumann/aca-postgres:17-railway)
#     - PROFILE=railway-neon              Neon (with branching for agent workflows)
#     - PROFILE=railway-supabase          Supabase (currently no sibling — extend supabase-cloud)
#
#   Graph DB:
#     - PROFILE=railway-falkordb          FalkorDB (current production default)
#     - PROFILE=railway-neo4j             Neo4j AuraDB (legacy/alternative)
#
# Pick one overlay per axis. Profile inheritance only supports a single
# parent; if you need a non-default combination on both axes (e.g. Neon
# RDB + FalkorDB graph), create a dedicated leaf profile that extends
# one and overrides the other.
#
# Railway auto-injects these environment variables:
#   - RAILWAY_DATABASE_URL (or DATABASE_URL)
#   - MINIO_ROOT_USER, MINIO_ROOT_PASSWORD (if MinIO service added)
#   - PORT (for the web service)
#
# Database: ParadeDB GHCR image (ghcr.io/jankneumann/aca-postgres:17-railway)
#   Pre-installed extensions: pgvector, pg_search, pgmq, pg_cron
#   See railway/postgres/README.md for deployment instructions
#
# Required secrets in .secrets.yaml or environment:
#   - LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY (for observability)
#   - ANTHROPIC_API_KEY
#   - graph-backend credentials (see sibling profile)
#
# Override to Braintrust: set OBSERVABILITY_PROVIDER=braintrust and BRAINTRUST_API_KEY

name: railway
extends: base
description: Shared Railway deployment base — pick railway-falkordb or railway-neo4j sibling

providers:
  database: railway
  storage: railway
  observability: langfuse

settings:
  environment: production
  log_level: INFO

  # CORS - update with your Railway frontend URL
  allowed_origins: "${ALLOWED_ORIGINS:-https://your-app.up.railway.app}"

  api:
    api_base_url: "${API_BASE_URL:-https://your-app.up.railway.app}"
    api_timeout: 300

  database:
    # Railway auto-injects DATABASE_URL or RAILWAY_DATABASE_URL
    # RAILWAY_DATABASE_URL takes precedence; DATABASE_URL used as env fallback
    # (nested interpolation unsupported — use env var override instead)
    railway_database_url: "${RAILWAY_DATABASE_URL:-}"

    # Railway PostgreSQL pool settings (optimized for Hobby plan)
    railway_pool_size: 3
    railway_max_overflow: 2
    railway_pool_recycle: 300
    railway_pool_timeout: 30

  graphdb:
    # Both Railway variants run their graph DB in cloud mode
    # (AuraDB managed service or FalkorDB Railway service)
    graphdb_mode: cloud

  storage:
    # Railway MinIO (auto-injected credentials)
    storage_provider: railway
    minio_root_user: "${MINIO_ROOT_USER:-}"
    minio_root_password: "${MINIO_ROOT_PASSWORD:-}"
    railway_minio_endpoint: "${RAILWAY_MINIO_ENDPOINT:-}"
    railway_minio_bucket: "${RAILWAY_MINIO_BUCKET:-newsletter-files}"

  observability:
    # Langfuse Cloud for LLM observability
    langfuse_public_key: "${LANGFUSE_PUBLIC_KEY:-}"
    langfuse_secret_key: "${LANGFUSE_SECRET_KEY:-}"

    otel_enabled: true
    otel_service_name: newsletter-aggregator

  api_keys:
    anthropic_api_key: "${ANTHROPIC_API_KEY:-}"
    openai_api_key: "${OPENAI_API_KEY:-}"
    google_api_key: "${GOOGLE_API_KEY:-}"
    tavily_api_key: "${TAVILY_API_KEY:-}"
    elevenlabs_api_key: "${ELEVENLABS_API_KEY:-}"
    sendgrid_api_key: "${SENDGRID_API_KEY:-}"
    admin_api_key: "${ADMIN_API_KEY:-}"
    voyage_api_key: "${VOYAGE_API_KEY:-}"
    cohere_api_key: "${COHERE_API_KEY:-}"
    jina_api_key: "${JINA_API_KEY:-}"

  search:
    embedding_provider: openai
    embedding_model: text-embedding-3-small
    embedding_dimensions: 1536
    search_rerank_enabled: true
    search_rerank_provider: cohere
    search_rerank_model: rerank-english-v3.0
