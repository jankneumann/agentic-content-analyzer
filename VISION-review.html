<!doctype html>
<!--
  /vision review board TEMPLATE (ships as skills/vision/assets/review-template.html).
  Fill ONLY the slots agentic-content-analyzer, from-scratch draft, round 4 (H-1..H-9 folded in), {{DRAFT_MARKDOWN}}, and CARDS,
  per SKILL.md step 6: copy next to review.css, change nothing else.
  The in-page ledger is a convenience for the author, never the channel of record;
  verdicts of record return through the host's question tool (SKILL.md step 6c).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/vision review - agentic-content-analyzer</title>
<link rel="stylesheet" href="review.css">
</head>
<body class="vr">

<header class="vr-head">
  <div class="vr-title">/vision review</div>
  <div class="vr-meta">agentic-content-analyzer · from-scratch draft, round 4 (H-1..H-9 folded in)</div>
</header>

<main class="vr-main">

  <section class="vr-draft">
    <span class="vr-label">latest draft · full text</span>
    <article class="vr-doc" id="vr-doc"></article>
  </section>

  <aside class="vr-side">
    <div class="vr-progress"><span>hypotheticals</span><b id="vr-progress"></b></div>
    <div class="vr-stack" id="vr-stack"></div>
    <div class="vr-done" id="vr-done" hidden>
      <h2>All verdicts recorded</h2>
      <ul class="vr-ledger" id="vr-ledger"></ul>
    </div>
  </aside>

</main>

<script>
// {{DRAFT_MARKDOWN}} - replace the whole placeholder (quotes included) with the
// full VISION.md text as ONE JSON string literal, i.e. JSON.stringify(markdown).
// A raw template literal would break on the backticks the vision's own output
// format mandates.
const DRAFT = "# Vision\n\nagentic-content-analyzer exists so that people who must keep up with a fast-moving field get trend analysis and leadership advice they can trust.\nIt serves technical leaders and practitioners first, and anyone who points it at their own sources and prompts, because the repository is public and the domain focus lives in configuration.\nIt owns exactly one thing: turning external content, memories, and observations into durably stored, verifiably summarized knowledge.\n\n## A claim of success must be provable, not reported\n\nA backup, a workflow submission, or a digest run is not done because a process exited zero.\nIt is done when the artifact it was supposed to produce is checked back, byte for byte.\nA shell pipeline that reports only its last stage's exit code is treated as a defect, not a shortcut.\nA test that mocks a subprocess's output into the shape the code expects, rather than the bytes the real tool emits, does not count as coverage.\nA 5xx response is a claim about this system's own health, and mapping every exception to one blindly misdirects an operator's response.\nEvery path that can reject or fail a workflow lands somewhere an operator can see it, because a rejection that fails silently is worse than one that crashes loudly.\n\n## The structure is deterministic and durable, the judgment is agentic, the decisions are human\n\nWhat runs, in what order, with what inputs, is fixed code, never a model's choice at runtime.\nCLI, HTTP, MCP, and the frontend submit the same operation types to one durable queue, and none of them executes ingestion, summarization, digest, or audio work inline.\nAn in-memory queue, a background task, or a direct execution path is a durability regression, not an optimization.\nA feature that cannot survive a restart mid-run is not finished.\nInside that structure, agentic specialists supply the judgment that has to scale: ranking, synthesis, analysis, and the questions a deterministic step cannot answer.\nJudgment a specialist should not make alone escalates to a human decision through an approval gate, and the gate is a recorded step, not a suggestion.\nA focused lookup does not go through the specialist framework; the framework exists for multi-step analysis, not for work a deterministic pipeline does better.\nAgents with distinct goals, such as independent research or an AI tutor, use the system as a tool, and each is defined by clear goals and clear limits before it runs.\nRisk tiers change only with human approval.\nA gate may learn from observation and empirical evidence, but the agent subject to a gate is never the source of a change to it; that change is always a separate process.\n\n## Built for today's scale, behind abstractions that can carry tomorrow's\n\nDesigns are sized to the scale the project actually runs at, not to the scale it might reach.\nComplexity is added when a need is demonstrated, not when it is imagined, and it arrives inside an existing abstraction rather than as a new subsystem.\nThe abstractions stay clean enough that the next step up in complexity is an addition, not a rewrite.\nA simpler mechanism that is proven to work is preferred over a stronger one that is not yet proven here.\nBoundaries between modules are thin abstraction layers with a contract, so a module can be replaced in line with its contract without touching its neighbors.\n\n## Providers are chosen explicitly and held behind thin abstractions\n\nDatabase, object storage, graph database, and observability each ship at least two interchangeable backends, selected by configuration, not by code branch.\nA provider that shapes capabilities or the build is named explicitly in configuration, never inferred from other settings, because an explicit choice is what keeps the whole stack aligned around it.\nEach provider gets a dedicated build path behind the same thin abstraction, so a provider-specific capability can be used where it earns its place without the rest of the stack learning that provider's name.\nMoving off a host is a planned capability, not a fire drill.\n\n## The project holds its own history to the evidence standard it demands of its infrastructure\n\nSpecs describe current, evidenced behavior.\nA checked requirement that contradicts running behavior gets reclassified, not left checked.\nArchived decisions are never rewritten.\nA later change supersedes a decision in the open, in a new document, rather than editing history.\nA roadmap idea with no bounded proposal, task plan, or spec delta does not get promoted into a feature because it sounds compelling.\nIndependently deployed consumers are served through standard revision and upgrade mechanisms: versioned contracts, compatibility windows stated in writing, and thin adapters that carry a retirement date.\nA retired contract shape does not come back unversioned, undated, or by accident.\n\n## A process that can delete never runs unattended, and a compromised credential never unlocks everything\n\nRetention against the backup target is dry run by default and cannot delete.\nOnly a human-run command can delete a backup.\nA backup host's own credentials are sufficient to write a new backup and never sufficient to decrypt an old one.\nIngested content is precious, not re-derivable: it carries the provenance behind every claim, and it is reprocessed as models and the system improve, so it is kept and backed up alongside human decisions.\n\n## Scope\n\nIt is not a system whose domain is fixed in code: what it pays attention to, the voice it writes in, and which personas analyze it live in prompts, personas, and source lists.\nIt is not a general-purpose agent platform: it is a tool that agents with a defined goal and defined limits use, and an agent without both does not run here.\nIt is not a CI system, or a place to bolt on every integration a source could plausibly offer.\nIt is not a cache: what it ingests it keeps, with provenance, because a better model will read it again.\nIt is not a marketing surface: digest quality is measured against a written content guideline, not against enthusiasm.\n\nA change aligns when it can prove the artifact it claims to produce, survives a restart, keeps a provider behind its abstraction, is sized to the scale that exists, defines an agent's goals and limits before it runs, and states its evidence.\nA change should be resisted when it reports success without checking, executes a mutation inline just this once, lets a model decide what the pipeline runs next, adds a subsystem for a scale that has not arrived, infers a provider instead of naming it, teaches the stack a vendor's name outside its adapter, treats ingested content as disposable, lets an agent change the gate it is subject to, rewrites archived history, or hands delete authority to an unattended process.\n";

const CARDS = [
  {
    "id": "H-10",
    "title": "Ship a valuable breaking API change ahead of consumer migration",
    "body": "A genuinely valuable API redesign is ready, but agentic-assistant's migration is behind schedule for reasons outside this project's control; the team debates shipping the breaking change on the stated deadline anyway, versus holding it until the consumer is confirmed ready.",
    "tests": "Tests: \"versioned contracts, compatibility windows stated in writing, and thin adapters that carry a retirement date.\"",
    "why": "Yes: a window stated in writing is a deadline, not an open-ended wait, and holding valuable work hostage to another team's unrelated delays rewards slow migration. No: a compatibility policy that ships on the calendar date regardless of the consumer's actual state is really just a unilateral break with extra paperwork, and the whole point of naming the window was to give the consumer a real, not nominal, chance to move."
  },
  {
    "id": "H-11",
    "title": "Ship an experimental feature behind a flag with only mocked tests",
    "body": "An engineer wants to ship a low-risk, internal-only, feature-flagged prototype with unit tests that mock the external tool calls it makes, planning to backfill full end-to-end verification once the prototype proves useful enough to invest further in.",
    "tests": "Tests: \"A test that mocks a subprocess's output into the shape the code expects, rather than the bytes the real tool emits, does not count as coverage.\"",
    "why": "Yes: demanding full end-to-end proof before a feature is even validated as worth building is a tax on exploration, and a flag-gated, internal-only surface has a small enough blast radius that a mocked test is a reasonable temporary stand-in. No: the project's sharpest lessons, the 13-point widening and the backup verify bug, both came from a mock that returned the shape the code expected instead of what the real tool produces; 'backfill it later' is exactly the deferral that let those bugs ship unnoticed in the first place."
  }
];

const VERDICTS = ['In vision','Off mission','Conditional'];

/* ------- no changes below this line ------- */

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>'); }
const out=[]; let para=[];
const flush=()=>{ if(para.length){ out.push('<p>'+para.map(inline).join(' ')+'</p>'); para=[]; } };
for(const line of DRAFT.split('\n')){
  if(line.startsWith('## ')){ flush(); out.push('<h2>'+inline(line.slice(3))+'</h2>'); }
  else if(line.startsWith('# ')){ flush(); out.push('<h1>'+inline(line.slice(2))+'</h1>'); }
  else if(line.trim()===''){ flush(); }
  else para.push(line);
}
flush();
document.getElementById('vr-doc').innerHTML = out.join('\n');

const stack = document.getElementById('vr-stack');
let topIdx = 0; const ledger = [];
stack.innerHTML = CARDS.map((c,i) => `
  <div class="vr-card" id="vrc-${i}">
    <span class="vr-card-id">${esc(c.id)} · ${i+1}/${CARDS.length}</span>
    <h3 class="vr-card-title">${esc(c.title)}</h3>
    <p class="vr-card-body">${esc(c.body)}</p>
    <div class="vr-card-tests">${esc(c.tests)}</div>
    <div class="vr-why"><span class="vr-why-label">Why the answer is not obvious</span><p>${esc(c.why)}</p></div>
    <div class="vr-verdicts">${VERDICTS.map(v => `<button type="button" aria-pressed="false" onclick="pick(${i}, this)">${v}</button>`).join('')}</div>
    <textarea class="vr-reason" placeholder="reasoning (this is what the vision gets rebuilt from)"></textarea>
    <button type="button" class="vr-commit" disabled onclick="commit(${i})">Record verdict</button>
  </div>`).join('');

function layout(){
  CARDS.forEach((c,i) => {
    const el = document.getElementById('vrc-'+i);
    if (el.classList.contains('vr-gone')) return;
    const depth = i - topIdx;
    if (depth < 0 || depth > 2) { el.hidden = depth !== 0; }
    if (depth >= 0 && depth <= 2) { el.hidden = false; el.dataset.depth = String(depth); }
  });
  const n = Math.min(topIdx+1, CARDS.length);
  document.getElementById('vr-progress').textContent = `${n} / ${CARDS.length}`;
}
function pick(i, btn){
  const card = document.getElementById('vrc-'+i);
  card.querySelectorAll('.vr-verdicts button').forEach(b => b.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true');
  card.querySelector('.vr-commit').disabled = false;
}
function commit(i){
  const card = document.getElementById('vrc-'+i);
  const verdict = card.querySelector('.vr-verdicts button[aria-pressed="true"]')?.textContent;
  if(!verdict) return;
  const notes = card.querySelector('.vr-reason').value.trim();
  ledger.push({ id: CARDS[i].id, verdict, notes });
  card.classList.add('vr-gone');
  topIdx += 1;
  layout();
  setTimeout(() => { card.hidden = true; layout(); }, 360);
  if (topIdx >= CARDS.length) {
    document.getElementById('vr-ledger').innerHTML =
      ledger.map(l => `<li><b>${esc(l.id)}</b> ${esc(l.verdict)}${l.notes ? ' - ' + esc(l.notes) : ''}</li>`).join('');
    setTimeout(() => { document.getElementById('vr-done').hidden = false; }, 400);
  }
}
layout();
</script>
</body>
</html>
