name: aca-gx10

x-defaults: &defaults
  restart: "on-failure:5"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        cpus: "1.00"
        memory: 1G

x-stateful: &stateful
  <<: *defaults
  read_only: false
  networks:
    - stateful
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m

x-application: &application
  <<: *defaults
  image: "${GX10_APP_IMAGE:?set a reviewed application tag@sha256 digest}"
  env_file:
    - path: /run/aca/gx10/application.env
      required: true
    - path: /run/aca/gx10/proxy.env
      required: true
  environment:
    PROFILE: gx10
    GX10_RUNTIME_ENABLED: "true"
    NO_PROXY: "localhost,127.0.0.1,.gx10.internal"
  networks:
    - application
    - stateful
  depends_on: &application-dependencies
    app-postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    openbao:
      condition: service_healthy
    squid:
      condition: service_healthy
    langfuse-web:
      condition: service_healthy
  volumes:
    - /srv/aca/application:/srv/aca:rw
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  stop_grace_period: 45s

services:
  app-postgres:
    <<: *stateful
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    env_file:
      - path: /run/aca/gx10/stateful.env
        required: true
    environment:
      POSTGRES_DB: newsletters
      POSTGRES_USER: newsletter_user
    volumes:
      - /srv/aca/postgres:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsletter_user -d newsletters"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  langfuse-postgres:
    <<: *stateful
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    env_file:
      - path: /run/aca/gx10/stateful.env
        required: true
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
    volumes:
      - /srv/aca/langfuse-postgres:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    <<: *stateful
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    env_file:
      - path: /run/aca/gx10/stateful.env
        required: true
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - /srv/aca/redis:/data:rw
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j:
    <<: *stateful
    image: neo4j:5.26-community@sha256:037cf5756f0135cbfd66b739b6df7c7c4bb100f9ce11602f6f9538e17e02c74d
    env_file:
      - path: /run/aca/gx10/stateful.env
        required: true
    environment:
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - /srv/aca/neo4j:/data:rw
      - /srv/aca/neo4j-logs:/logs:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  clickhouse:
    <<: *stateful
    image: clickhouse/clickhouse-server:25.3.6.56-alpine@sha256:157423fca52f596b62a1bf301b037b9f74bfca38089aa57d1bd36c9025f7ecef
    env_file:
      - path: /run/aca/gx10/stateful.env
        required: true
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
    volumes:
      - /srv/aca/clickhouse:/var/lib/clickhouse:rw
      - /srv/aca/clickhouse-logs:/var/log/clickhouse-server:rw
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  minio:
    <<: *stateful
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    env_file:
      - path: /run/aca/gx10/stateful.env
        required: true
    command: ["server", "--console-address", ":9090", "/data"]
    volumes:
      - /srv/aca/minio:/data:rw
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  openbao:
    <<: *stateful
    image: quay.io/openbao/openbao:2.2@sha256:d5d098f98f5ca7cae2e33d1e6dd9e2bea332275ad6bb7ff09032b48af3e1141e
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    cap_add:
      - IPC_LOCK
    volumes:
      - /srv/aca/openbao:/openbao/data:rw
      - ./deploy/gx10/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1; test $$? -le 2"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  langfuse-web:
    <<: *defaults
    image: langfuse/langfuse:3@sha256:a921990b3cf6f62e9452eaf8ab9bea045852375a6883abd1fdbe63afa08defa0
    env_file:
      - path: /run/aca/gx10/langfuse.env
        required: true
    networks:
      - application
      - stateful
    depends_on: &langfuse-dependencies
      langfuse-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

  langfuse-worker:
    <<: *defaults
    image: langfuse/langfuse:3@sha256:a921990b3cf6f62e9452eaf8ab9bea045852375a6883abd1fdbe63afa08defa0
    env_file:
      - path: /run/aca/gx10/langfuse.env
        required: true
    networks:
      - stateful
    depends_on:
      <<: *langfuse-dependencies
      langfuse-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 15s
      timeout: 5s
      retries: 12

  squid:
    <<: *defaults
    image: "ubuntu/squid:6.13-25.10_beta@sha256:${GX10_SQUID_DIGEST:?set the reviewed published manifest digest}"
    networks:
      - application
      - egress
    volumes:
      - ./deploy/gx10/squid/squid.conf:/etc/squid/squid.conf:ro
      - ./deploy/gx10/squid/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
      - /run/aca/gx10/proxy:/run/aca/gx10/proxy:ro
      - /srv/aca/squid-logs:/var/log/squid:rw
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/squid -k parse -f /etc/squid/squid.conf >/dev/null 2>&1 && test -f /run/aca/gx10/proxy/policy.ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    <<: *application
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment:
      PROFILE: gx10
      GX10_RUNTIME_ENABLED: "true"
      NO_PROXY: "localhost,127.0.0.1,.gx10.internal"
      TELEMETRY_SERVICE_INSTANCE_ID: aca-gx10-api
      WORKER_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/ready\", timeout=3)'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  worker:
    <<: *application
    command: ["python", "-m", "src.worker"]
    environment:
      PROFILE: gx10
      GX10_RUNTIME_ENABLED: "true"
      NO_PROXY: "localhost,127.0.0.1,.gx10.internal"
      TELEMETRY_SERVICE_INSTANCE_ID: aca-gx10-worker
      WORKER_CONCURRENCY: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1, 0)'"]
      interval: 15s
      timeout: 5s
      retries: 12

  scheduler:
    <<: *application
    command: ["python", "-m", "src.worker"]
    environment:
      PROFILE: gx10
      GX10_RUNTIME_ENABLED: "true"
      NO_PROXY: "localhost,127.0.0.1,.gx10.internal"
      TELEMETRY_SERVICE_INSTANCE_ID: aca-gx10-scheduler
      WORKER_CONCURRENCY: "1"
      GX10_PROCESS_ROLE: scheduler
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1, 0)'"]
      interval: 15s
      timeout: 5s
      retries: 12

  maintenance:
    <<: *application
    command: ["python", "-m", "src.worker"]
    environment:
      PROFILE: gx10
      GX10_RUNTIME_ENABLED: "true"
      NO_PROXY: "localhost,127.0.0.1,.gx10.internal"
      TELEMETRY_SERVICE_INSTANCE_ID: aca-gx10-maintenance
      WORKER_CONCURRENCY: "1"
      GX10_PROCESS_ROLE: maintenance
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1, 0)'"]
      interval: 15s
      timeout: 5s
      retries: 12

  caddy:
    <<: *defaults
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    env_file:
      - path: /run/aca/gx10/caddy.env
        required: true
    ports:
      - "127.0.0.1:8443:443"
    networks:
      - application
    depends_on:
      api:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    volumes:
      - ./deploy/gx10/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/aca/caddy-data:/data:rw
      - /srv/aca/caddy-config:/config:rw
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 12

networks:
  application:
    internal: true
    driver: bridge
    labels:
      gx10.route-policy: proxy-only
  stateful:
    internal: true
    driver: bridge
  egress:
    internal: false
    driver: bridge
    labels:
      gx10.route-owner: squid-only
