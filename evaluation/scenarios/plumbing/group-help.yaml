# Category: plumbing — no backend, no database, no credentials.
#
# The coverage floor for the whole declared command surface: every command declared in
# the descriptor answers `--help` with exit 0. 32 commands across
# 8 scenarios of at most 5 steps each.
#
# ---------------------------------------------------------------------------
# Why batched, and what it costs
# ---------------------------------------------------------------------------
#
# One scenario per command would be the better shape: gen-eval's evaluator
# short-circuits a scenario at its first failing step and marks the remainder `skip`, so
# grouping commands means a broken one can mask up to 3 others behind it.
#
# It does not fit. The pinned runner caps a run in two stages, neither settable from its
# CLI. The generator truncates to `max_scenarios_per_iteration` (50); then the
# orchestrator splits that budget into three tiers and allocates
# int(50*0.40)=20 slots to scenarios matching --changed-features-ref, int(50*0.35)=17 to
# priority <= 1, and the remaining 13 to everything else. Unused tier-1 slots do not
# reflow, so a run without change detection can evaluate at most 30 scenarios, of which
# at most 13 may be non-critical.
#
# 32 one-command scenarios therefore cannot run whatever priority they carry:
# at priority >= 2 the tier-3 cap keeps 13 of them, and at priority <= 1 they crowd the
# behavioural scenarios out of tier 2. The first version of this file learned that the
# expensive way — 32 expected, 13 evaluated, "PASS (100.0%)", exit 0. That report is
# what `scenarios_expected` in the contract validator and the tier assertions in
# tests/cli_gen_eval/test_descriptor_drift.py now exist to prevent.
#
# So: batches of 4, priority 2 so truncation would reach the help sweep before it
# reaches behavioural coverage, and 8 scenarios against a 13-slot tier —
# room for roughly 20 more command groups before this needs
# revisiting, which the drift test asserts rather than trusting.
#
# Masking is bounded and named: a failing step reports as a failure, and the skipped
# steps after it are reported as `skip` rather than `pass`. What is lost is which of the
# following 3 commands would also have failed — not whether a failure occurred.
#
# UPSTREAM.md UP-6 asks for the cap to be settable and for unused tier allocation to
# reflow. Landing it makes one-scenario-per-command affordable again, and this file
# should go back to a single parameterised template at that point.
#
# ---------------------------------------------------------------------------
#
# Why exit 0 is sufficient evidence, with no assertion on the help text: Click cannot
# exit 0 for a command it does not have — `aca not-a-command` exits 2, which
# validation/malformed-arguments.yaml pins. So a zero exit *is* the registration proof,
# and asserting substrings of Rich-rendered, width-wrapped help would only add
# brittleness. gen-eval offers no output-substring matcher on the success path anyway,
# only `error_contains`, which would read as nonsense in a passing report row.
#
# The batch membership below is alphabetical by command name, so it is predictable and
# reviewable rather than incidental. `backup` was added to batch 1 as a fifth step
# rather than by reflowing every batch: reflowing would have moved commands between
# scenarios, which churns the captured report fixtures in tests/fixtures/gen_eval/
# far beyond the one interface that actually changed. tests/cli_gen_eval/test_descriptor_drift.py asserts
# these steps and the descriptor's declared commands are the same set, in both
# directions.

- id: plumbing-help-batch-01
  name: 'aca --help sweep, batch 1: agent, audio-digest, auth, backup, batch'
  description: >
    Each of these commands is registered on the root application and renders its
    own help without a backend, a database, or credentials. Credits the
    interfaces cli:agent, cli:audio-digest, cli:auth, cli:backup, cli:batch.
  category: plumbing
  priority: 2
  interfaces:
    - "cli:agent"
    - "cli:audio-digest"
    - "cli:auth"
    - "cli:backup"
    - "cli:batch"
  tags:
    - read-only
    - no-target
  steps:
    - id: help-agent
      transport: cli
      command: agent
      args:
        - "--help"
      expect:
        exit_code: 0
        not_empty: true
    - id: help-audio-digest
      transport: cli
      command: audio-digest
      args:
        - "--help"
      expect:
        exit_code: 0
        not_empty: true
    - id: help-auth
      transport: cli
      command: auth
      args:
        - "--help"
      expect:
        exit_code: 0
        not_empty: true
    - id: help-backup
      transport: cli
      command: backup
      args:
        - "--help"
      expect:
        exit_code: 0
        not_empty: true
    - id: help-batch
      transport: cli
      command: batch
      args:
        - "--help"
      expect:
        exit_code: 0
        not_empty: true

