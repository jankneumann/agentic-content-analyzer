# Category: workflow-submission — MUTATING. Submits durable work.
#
# These scenarios do not run unless two separate things both happen: the category is
# named explicitly (the default selection is read-only), and the mutation guard accepts a
# ProtectedTargetPolicy describing a staging or ephemeral target that is the same origin
# the CLI resolves. See src/cli_gen_eval/mutation_guard.py.
#
# ---------------------------------------------------------------------------
# What is being claimed, and what is deliberately not
# ---------------------------------------------------------------------------
#
# The claim is the submission contract: every canonical operation type can be submitted
# through the CLI and comes back as a durable operation handle that the API will then
# resolve by id. It is NOT a claim that the work succeeds. `src/api/workflow_routes.py`
# performs no existence checks — `podcast-script create --digest-id <absent>` enqueues
# happily and fails later in the worker — and that separation is the point rather than a
# gap. A submission scenario that depended on seeded content would be testing the
# pipeline's business logic through the narrowest possible aperture, and would fail for
# reasons that have nothing to do with the CLI surface under evaluation.
#
# So the inputs below are deliberately synthetic: identifiers no row will ever carry, a
# period window in the past, a source name that matches nothing. Each operation is
# expected to be enqueued and then to fail or no-op. What is asserted is that it was
# enqueued, addressably.
#
# ---------------------------------------------------------------------------
# Why each scenario submits twice
# ---------------------------------------------------------------------------
#
# `--json` on this CLI is a root-level flag, so the machine-readable spelling has to put
# it in `step.command` — and a `command` beginning with a dash credits no interface,
# because interface identity is the words of `command` before its first flag. A scenario
# that only used the JSON spelling would evaluate the submission and credit nothing.
#
# The cost is smaller than it looks. Both steps send an identical payload, and
# `OperationService.submit` derives its idempotency key from a hash of that payload when
# the client sends no `Idempotency-Key` header, which the CLI does not unless asked. The
# second step therefore returns the *same* operation as the first for as long as it is
# still queued or in progress (`src/queue/setup.py::enqueue_queue_job` dedupes on
# `(entrypoint, idempotency_key)` for non-terminal rows). Two submissions, normally one
# durable operation.
#
# Step three then resolves the captured id through `operations get`. That is the actual
# evidence for "returns a durable operation handle": not that the response had the right
# shape, but that the identifier in it addresses something the API can find.

- id: workflow-submission-ingestion
  name: aca ingest url submits a durable ingestion operation
  description: >
    Covers OperationType.INGESTION_EXECUTE. `ingest url` is chosen over the
    configured-source kinds because its side effect is bounded to a single fetch of one
    named URL rather than a sweep of every feed in sources.d/, which matters when the
    target is a shared staging environment.
  category: workflow-submission
  priority: 1
  interfaces:
    - "cli:ingest"
    - "cli:operations"
  tags:
    - mutating
    - requires-target
  steps:
    - id: ingest-url-attributed
      transport: cli
      command: ingest
      args:
        - url
        - "https://example.com/aca-gen-eval"
      expect:
        exit_code: 0

    - id: ingest-url-json
      transport: cli
      command: "--json"
      args:
        - ingest
        - url
        - "https://example.com/aca-gen-eval"
      expect:
        exit_code: 0
        body_contains:
          operation_type: "ingestion.execute"
      capture:
        operation_id: "$.operation_id"

    - id: ingest-url-handle-resolves
      transport: cli
      command: operations
      args:
        - get
        - "{{ operation_id }}"
      expect:
        exit_code: 0
        not_empty: true

