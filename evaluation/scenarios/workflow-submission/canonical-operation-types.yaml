- id: workflow-submission-digest
  name: aca digest create submits a durable digest operation
  description: >
    Covers OperationType.DIGEST_CREATE. The period is a fixed one-day window in the
    past, so re-running this scenario submits the same payload and therefore recovers
    the same operation rather than accumulating new ones.
  category: workflow-submission
  priority: 1
  interfaces:
    - "cli:digest"
    - "cli:operations"
  tags:
    - mutating
    - requires-target
  steps:
    - id: digest-create-attributed
      transport: cli
      command: digest
      args:
        - create
        - "--type"
        - daily
        - "--period-start"
        - "2020-01-01T00:00:00Z"
        - "--period-end"
        - "2020-01-02T00:00:00Z"
      expect:
        exit_code: 0

    - id: digest-create-json
      transport: cli
      command: "--json"
      args:
        - digest
        - create
        - "--type"
        - daily
        - "--period-start"
        - "2020-01-01T00:00:00Z"
        - "--period-end"
        - "2020-01-02T00:00:00Z"
      expect:
        exit_code: 0
        body_contains:
          operation_type: "digest.create"
      capture:
        operation_id: "$.operation_id"

    - id: digest-create-handle-resolves
      transport: cli
      command: operations
      args:
        - get
        - "{{ operation_id }}"
      expect:
        exit_code: 0
        not_empty: true

- id: workflow-submission-pipeline
  name: aca pipeline run submits a durable pipeline operation
  description: >
    Covers OperationType.PIPELINE_RUN, the one submission here whose execution would be
    expensive. `--source` names a source that does not exist, so the ingestion stage of
    the enqueued run has nothing to sweep even if a worker picks it up.
  category: workflow-submission
  priority: 1
  interfaces:
    - "cli:pipeline"
    - "cli:operations"
  tags:
    - mutating
    - requires-target
  steps:
    - id: pipeline-run-attributed
      transport: cli
      command: pipeline
      args:
        - run
        - "--period"
        - daily
        - "--period-start"
        - "2020-01-01T00:00:00Z"
        - "--period-end"
        - "2020-01-02T00:00:00Z"
        - "--source"
        - aca-gen-eval-no-such-source
      expect:
        exit_code: 0

    - id: pipeline-run-json
      transport: cli
      command: "--json"
      args:
        - pipeline
        - run
        - "--period"
        - daily
        - "--period-start"
        - "2020-01-01T00:00:00Z"
        - "--period-end"
        - "2020-01-02T00:00:00Z"
        - "--source"
        - aca-gen-eval-no-such-source
      expect:
        exit_code: 0
        body_contains:
          operation_type: "pipeline.run"
      capture:
        operation_id: "$.operation_id"

    - id: pipeline-run-handle-resolves
      transport: cli
      command: operations
      args:
        - get
        - "{{ operation_id }}"
      expect:
        exit_code: 0
        not_empty: true

