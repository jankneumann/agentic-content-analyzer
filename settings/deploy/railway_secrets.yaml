# Railway secret-sync allowlist
# ==============================
# Declares which LOCAL secret keys (from .secrets.yaml or env) may be pushed to
# each Railway service by `aca deploy sync-secrets`, and under what Railway
# variable name.
#
# IMPORTANT: this allowlist is the ONLY eligibility source. A local secret NOT
# listed here is never pushed — that is what keeps local-only dev values (e.g. a
# localhost database_url or a dev neo4j password) out of a deployed service.
#
# Entry forms:
#   - SIMPLE:  `- ANTHROPIC_API_KEY`            # Railway name == local name
#   - RENAME:  `- local: NEON_DATABASE_URL`     # push local value under a
#              `  railway: DATABASE_URL`         #   different Railway var name
#
# `extends: <service>` lets a service inherit another's secret list.
#
# Curate this per deployment — the defaults below cover the secrets that are
# safe to share verbatim (LLM keys + app auth). DB/graph/storage renames are
# left commented because their correct Railway names depend on which provider
# the deployed service uses.

services:
  api:
    secrets:
      # LLM provider keys (same name on Railway)
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GOOGLE_API_KEY
      - XAI_API_KEY
      # Web search
      - TAVILY_API_KEY
      # App auth — ADMIN_API_KEY drift between local and Railway is what caused
      # the 2026-05-30 403 on `aca ingest blog`; keeping it in sync here is the
      # whole point of this command.
      - ADMIN_API_KEY
      - APP_SECRET_KEY

      # --- Provider-dependent renames (uncomment + adjust for your deployment) ---
      # - local: NEON_DATABASE_URL
      #   railway: DATABASE_URL
      # - local: NEO4J_AURADB_URI
      #   railway: NEO4J_URI
      # - local: NEO4J_AURADB_PASSWORD
      #   railway: NEO4J_PASSWORD

  # The worker service shares the api service's secret set. Add worker-only
  # entries under its own `secrets:` list if they diverge.
  worker:
    extends: api
    secrets: []
