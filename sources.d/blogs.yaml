defaults:
  type: blog
  enabled: true
  max_entries: 10
  request_delay: 1.0
  content_filter_strategy: keyword

sources:
  # Anthropic research blog — all posts are on-topic, no filter needed
  - name: "Anthropic Research"
    url: "https://www.anthropic.com/research"
    tags: [ai, anthropic, research]
    content_filter_strategy: none
    max_entries: 10

  # Claude blog — product announcements and guides
  - name: "Claude Blog"
    url: "https://www.anthropic.com/news"
    tags: [ai, claude, product]
    link_selector: "a[href*='/news/']"
    content_filter_strategy: none
    max_entries: 10

  # stax.sh / codt management for llms
  - name: "Stax.sh"
    url: "https://stax.sh/news"
    tags: [ai, llm, agents]
    link_selector: "a[href*='/news/']"
    content_filter_strategy: none
    max_entries: 10

  # Anthropic engineering blog — postmortems, agent/harness design deep-dives
  - name: "Anthropic Engineering"
    url: "https://www.anthropic.com/engineering"
    tags: [ai, anthropic, engineering]
    link_selector: "a[href*='/engineering/']"
    content_filter_strategy: none
    max_entries: 10

  # Meta AI research & product blog (ai.meta.com)
  - name: "Meta AI"
    url: "https://ai.meta.com/blog/"
    tags: [ai, meta, research]
    link_selector: "a[href*='/blog/']"
    content_filter_strategy: none
    max_entries: 10

  # Stanford HAI — human-centered AI research, policy, and index reports
  - name: "Stanford HAI"
    url: "https://hai.stanford.edu/news"
    tags: [ai, research, policy, stanford]
    link_selector: "a[href*='/news/']"
    content_filter_strategy: none
    max_entries: 10

  # Together AI — inference infra & model engineering. rss.xml is live; scrape is backup.
  - name: "Together AI"
    url: "https://www.together.ai/blog"
    tags: [ai, infrastructure, inference]
    link_selector: "a[href*='/blog/']"
    rss_url: "https://www.together.ai/blog/rss.xml"
    content_filter_strategy: none
    max_entries: 10

  - name : "OpenAI Blog"
    url: "https://openai.com/news/"
    tags: [ai, openai, research, product]
    link_selector: "a[href*='/news/']"
    content_filter_strategy: none
    max_entries: 10

  # AWS Machine Learning is covered by its RSS feed (sources.d/rss.yaml) — no scraper needed.

  # AWS Architecture blog — broad (not all AI/Data); listed explicitly, left unfiltered.
  # Flip content_filter_strategy to llm + topics below if you want AI/Data only.
  - name: "AWS Architecture"
    url: "https://aws.amazon.com/blogs/architecture/"
    tags: [aws, architecture]
    link_selector: "a[href*='/blogs/architecture/']"
    content_filter_strategy: none
    max_entries: 10

  # AWS News blog (general) — filtered to AI & Data via LLM relevance check.
  # Falls back to "keep all" if the content-filtering model isn't configured.
  - name: "AWS News (AI & Data)"
    url: "https://aws.amazon.com/blogs/aws/"
    tags: [aws, ai, data]
    link_selector: "a[href*='/blogs/aws/']"
    content_filter_strategy: llm
    content_filter_topics:
      - artificial intelligence
      - machine learning
      - generative AI
      - large language models
      - data engineering
      - analytics
      - databases
    max_entries: 10

  # Microsoft Source — AI hub is JS-rendered (~2 chrome links). Topic feed is live.
  - name: "Microsoft AI News"
    url: "https://news.microsoft.com/source/topics/ai/"
    tags: [ai, microsoft]
    link_selector: "a[href*='/source/features/']"
    rss_url: "https://news.microsoft.com/source/topics/ai/feed"
    content_filter_strategy: none
    max_entries: 10

  # Microsoft Copilot blog — date-stamped post URLs; WordPress /feed is live.
  - name: "Microsoft Copilot"
    url: "https://www.microsoft.com/en-us/microsoft-copilot/blog/"
    tags: [ai, microsoft, copilot]
    link_pattern: "/blog/\\d{4}/\\d{2}/"
    rss_url: "https://www.microsoft.com/en-us/microsoft-copilot/blog/feed"
    content_filter_strategy: none
    max_entries: 10

  # Google DeepMind blog (deepmind.google) — research announcements
  - name: "Google DeepMind"
    url: "https://deepmind.google/blog/"
    tags: [ai, deepmind, research]
    link_selector: "a[href*='/blog/']"
    rss_url: "https://deepmind.google/blog/rss.xml"
    content_filter_strategy: none
    max_entries: 10

  # Thin scrape (<3 post links) falls back to rss_url, then <link rel=alternate>, then
  # /feed,/rss,/feed.xml. Cohere (cohere.com/blog) and Mistral (mistral.ai/news) have no
  # public feed — they still need JS rendering. OpenAI and Gemini are served via RSS
  # (see sources.d/rss.yaml).

  # Example with heuristic mode (no link_selector) and URL pattern filter
