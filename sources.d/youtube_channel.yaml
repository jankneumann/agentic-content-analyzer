# YouTube channels ingested via the YouTube Data API (paginated).
# Migrated from youtube_rss.yaml to bypass the ~15-item Atom feed cap:
# each channel resolves to its uploads playlist and pages through history
# up to max_entries. Dedup (by source_id) keeps steady-state runs cheap;
# the first run backfills up to max_entries per channel.
defaults:
  type: youtube_channel
  max_entries: 25            # clears the old 15-cap; bump for a deeper backfill
  gemini_summary: true
  gemini_resolution: low     # high-volume channels — keep cost low (matches old RSS path)
  proofread: true
  hint_terms:
    - Claude
    - Anthropic
    - OpenAI
    - LLaMA
    - ChatGPT
    - Gemini
    - Mistral
    - GPT-4
    - GPT-4o
    - DeepSeek
    - Llama
    - Hugging Face
    - LangChain
    - LlamaIndex
    - Midjourney
    - Stable Diffusion
    - DALL-E
    - Sora
    - Whisper
    - Copilot
