name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal default permissions — individual jobs widen only if they must.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system ruff mypy

      - name: Run Ruff linter
        run: ruff check src/

      - name: Run Ruff formatter check
        run: ruff format --check src/

      - name: Check Alembic single head
        run: python scripts/check_alembic_heads.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run mypy type checking
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [api, cli-stack, services-stack, rest]
    services:
      postgres:
        image: paradedb/paradedb:0.22.2-pg17
        env:
          POSTGRES_USER: newsletter_user
          POSTGRES_PASSWORD: newsletter_password
          POSTGRES_DB: newsletters
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run tests (shard ${{ matrix.shard }})
        env:
          DATABASE_URL: postgresql://newsletter_user:newsletter_password@localhost:5432/newsletters
          ANTHROPIC_API_KEY: test-key-for-ci
          ENVIRONMENT: test
        # Coverage intentionally omitted: no external consumer (no codecov,
        # SonarCloud retired). Run `make test-cov` locally when you want it.
        # Shard layout: roughly balanced by test-file count. The `rest` shard
        # uses --ignore for the other shards' paths so new test directories
        # automatically route there without a workflow update.
        run: |
          case "${{ matrix.shard }}" in
            api)
              PATHS="tests/api"
              ;;
            cli-stack)
              PATHS="tests/cli tests/agents tests/mcp tests/integration"
              ;;
            services-stack)
              PATHS="tests/test_services tests/services tests/test_ingestion tests/test_processors tests/ingestion"
              ;;
            rest)
              PATHS="tests/ \
                --ignore=tests/api \
                --ignore=tests/cli \
                --ignore=tests/agents \
                --ignore=tests/mcp \
                --ignore=tests/integration \
                --ignore=tests/test_services \
                --ignore=tests/services \
                --ignore=tests/test_ingestion \
                --ignore=tests/test_processors \
                --ignore=tests/ingestion \
                --ignore=tests/contract \
                --ignore=tests/e2e"
              ;;
          esac
          pytest $PATHS -v --no-cov -x -m "not hoverfly and not contract"

  contract-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.22.2-pg17
        env:
          POSTGRES_USER: newsletter_user
          POSTGRES_PASSWORD: newsletter_password
          POSTGRES_DB: newsletters
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://newsletter_user:newsletter_password@localhost:5432/newsletters
          APP_SECRET_KEY: test-secret-key-for-ci
        run: |
          alembic upgrade head

      - name: Run API contract and fuzz tests
        env:
          DATABASE_URL: postgresql://newsletter_user:newsletter_password@localhost:5432/newsletters
          DATABASE_PROVIDER: local
          ANTHROPIC_API_KEY: test-key-for-ci
          ADMIN_API_KEY: test-admin-key
          APP_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: development
          WORKER_ENABLED: "false"
        run: |
          pytest tests/contract/ -m contract -v --no-cov --tb=short

  cold-start:
    name: Cold-start migration & boot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.22.2-pg17
        env:
          POSTGRES_USER: newsletter_user
          POSTGRES_PASSWORD: newsletter_password
          POSTGRES_DB: newsletters
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run full migration chain from scratch
        env:
          DATABASE_URL: postgresql://newsletter_user:newsletter_password@localhost:5432/newsletters
          ANTHROPIC_API_KEY: test-key-for-ci
          APP_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: production
        run: |
          echo "Running alembic upgrade head on empty database..."
          alembic upgrade head
          echo "✓ All migrations applied successfully"

      - name: Verify app boots with production profile
        env:
          DATABASE_URL: postgresql://newsletter_user:newsletter_password@localhost:5432/newsletters
          RAILWAY_DATABASE_URL: postgresql://newsletter_user:newsletter_password@localhost:5432/newsletters
          DATABASE_PROVIDER: railway
          PROFILE: railway-falkordb
          ANTHROPIC_API_KEY: test-key-for-ci
          APP_SECRET_KEY: test-secret-key-for-ci
          ADMIN_API_KEY: test-admin-key
          ENVIRONMENT: production
          WORKER_ENABLED: "false"
        run: |
          echo "Starting app with PROFILE=railway-falkordb..."
          timeout 10 python -c "
          import uvicorn, threading, time, httpx

          def start():
              uvicorn.run('src.api.app:app', host='127.0.0.1', port=8000, log_level='error')

          t = threading.Thread(target=start, daemon=True)
          t.start()
          time.sleep(3)

          resp = httpx.get('http://127.0.0.1:8000/health')
          assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
          print('✓ App booted and health check passed')
          " || { echo "::error::App failed to boot with railway-falkordb profile"; exit 1; }

  validate-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Validate all profiles
        env:
          ANTHROPIC_API_KEY: test-key-for-ci
        run: |
          echo "Validating profile templates..."
          for profile in profiles/*.yaml; do
            name=$(basename "$profile" .yaml)
            echo "Validating profile: $name"
            python -m src.cli profile validate "$name" || exit 1
          done
          echo "All profiles validated successfully!"

      - name: Check for hardcoded secrets in profiles
        run: |
          echo "Checking for hardcoded secrets in profiles..."
          # Check for common secret patterns in profile files
          if grep -rE "(sk-ant-|sk-[a-zA-Z0-9]{20,}|password\s*[:=]\s*['\"][^$][^'\"]+['\"])" profiles/*.yaml; then
            echo "::error::Potential hardcoded secrets found in profile files!"
            exit 1
          fi
          echo "No hardcoded secrets detected."
