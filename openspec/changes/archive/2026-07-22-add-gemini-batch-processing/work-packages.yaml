schema_version: 1

feature:
  id: add-gemini-batch-processing
  title: Gemini batch processing infrastructure
  plan_revision: 2

contracts:
  revision: 2
  openapi:
    primary: openspec/changes/add-gemini-batch-processing/contracts/README.md
    files:
      - openspec/changes/add-gemini-batch-processing/contracts/README.md
      - openspec/changes/add-gemini-batch-processing/contracts/db/schema.sql

defaults:
  priority: 3
  lock_ttl_minutes: 120
  timeout_minutes: 90
  retry_budget: 1
  verification_tier_required: A
  min_trust_level: 2

packages:
  - package_id: wp-persistence-config
    title: Persistence and safe-default configuration
    task_type: implement
    description: Add migrations, ORM models, lifecycle enums, typed settings, YAML defaults, and focused tests.
    role: backend-engineer
    priority: 1
    depends_on: []
    locks:
      files:
        - src/models/batch.py
        - src/models/__init__.py
        - src/config/settings.py
        - src/config/models.py
        - settings/models.yaml
      keys:
        - db:schema:batch_jobs
        - db:schema:batch_requests
        - env:gemini_batch_enabled
      ttl_minutes: 120
      reason: Own batch schema and configuration.
    scope:
      write_allow:
        - alembic/versions/*batch*.py
        - src/models/batch.py
        - src/models/__init__.py
        - src/config/settings.py
        - src/config/models.py
        - settings/models.yaml
        - tests/test_models/test_batch.py
        - tests/config/test_batch_config.py
        - tests/config/test_batch_settings.py
        - tests/migrations/test_batch_processing.py
      read_allow:
        - src/**
        - tests/**
        - alembic/**
        - settings/**
        - openspec/changes/add-gemini-batch-processing/**
    worktree:
      name: gemini-batch-persistence
      mode: isolated
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    metadata:
      loc_estimate: 450
      complexity: high
      package_kind: migration
    verification:
      tier_required: A
      steps:
        - name: persistence-tests
          kind: command
          command: .venv/bin/pytest tests/test_models/test_batch.py tests/config/test_batch_config.py tests/config/test_batch_settings.py tests/migrations/test_batch_processing.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count]
    outputs:
      result_keys: [files_modified, test_count]

  - package_id: wp-router-adapter
    title: Gemini batch router adapter
    task_type: implement
    description: Add batch types plus async inline submit/poll methods with strict metadata correlation and provider validation.
    role: provider-engineer
    priority: 1
    depends_on: []
    locks:
      files:
        - src/services/llm_router.py
      keys:
        - feature:add-gemini-batch-processing:adapter
      ttl_minutes: 120
      reason: Own provider API boundary.
    scope:
      write_allow:
        - src/services/llm_router.py
        - src/services/batch/types.py
        - src/services/batch/__init__.py
        - tests/test_services/test_llm_router_batch.py
      read_allow:
        - src/**
        - tests/**
        - settings/**
        - openspec/changes/add-gemini-batch-processing/**
    worktree:
      name: gemini-batch-router
      mode: isolated
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    metadata:
      loc_estimate: 400
      complexity: high
      package_kind: integration
    verification:
      tier_required: A
      steps:
        - name: router-tests
          kind: command
          command: .venv/bin/pytest tests/test_services/test_llm_router_batch.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count]
    outputs:
      result_keys: [files_modified, test_count]

  - package_id: wp-orchestration
    title: Collector, submitter, poller, and worker maintenance
    task_type: implement
    description: Implement batch configuration, collection, handler registry, concurrency-safe submit/poll/reconcile/fallback, and leader-elected worker maintenance.
    role: backend-engineer
    priority: 2
    depends_on: [wp-persistence-config, wp-router-adapter]
    locks:
      files:
        - src/queue/worker.py
      keys:
        - feature:add-gemini-batch-processing:orchestration
      ttl_minutes: 180
      reason: Own orchestration and worker integration.
    scope:
      write_allow:
        - src/services/batch/config.py
        - src/services/batch/collector.py
        - src/services/batch/handlers.py
        - src/services/batch/workers.py
        - src/queue/worker.py
        - tests/test_services/test_batch_collector.py
        - tests/test_services/test_batch_workers.py
        - tests/test_services/test_batch_disabled_regression.py
        - tests/queue/test_batch_maintenance.py
      read_allow:
        - src/**
        - tests/**
        - settings/**
        - openspec/changes/add-gemini-batch-processing/**
    worktree:
      name: gemini-batch-orchestration
      mode: isolated
    timeout_minutes: 150
    retry_budget: 1
    min_trust_level: 2
    metadata:
      loc_estimate: 850
      complexity: high
      package_kind: integration
    verification:
      tier_required: A
      steps:
        - name: orchestration-tests
          kind: command
          command: .venv/bin/pytest tests/test_services/test_batch_collector.py tests/test_services/test_batch_workers.py tests/test_services/test_batch_disabled_regression.py tests/queue/test_batch_maintenance.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count]
    outputs:
      result_keys: [files_modified, test_count]

  - package_id: wp-cli-docs
    title: Operations CLI, savings report, and documentation
    task_type: implement
    description: Add read-only status, reproducible cost reporting, JSON tests, and configuration/operator docs.
    role: backend-engineer
    priority: 3
    depends_on: [wp-orchestration]
    locks:
      files:
        - src/cli/app.py
        - src/cli/evaluate_commands.py
        - docs/MODEL_CONFIGURATION.md
        - CLAUDE.md
      keys:
        - feature:add-gemini-batch-processing:cli
      ttl_minutes: 120
      reason: Own user-visible operational surface.
    scope:
      write_allow:
        - src/cli/app.py
        - src/cli/batch_commands.py
        - src/cli/evaluate_commands.py
        - src/services/batch/savings.py
        - tests/cli/test_batch_commands.py
        - tests/test_services/test_batch_savings.py
        - docs/MODEL_CONFIGURATION.md
        - CLAUDE.md
      read_allow:
        - src/**
        - tests/**
        - docs/**
        - settings/**
        - openspec/changes/add-gemini-batch-processing/**
    worktree:
      name: gemini-batch-cli
      mode: isolated
    timeout_minutes: 120
    retry_budget: 1
    min_trust_level: 2
    metadata:
      loc_estimate: 500
      complexity: medium
      package_kind: integration
    verification:
      tier_required: A
      steps:
        - name: cli-tests
          kind: command
          command: .venv/bin/pytest tests/cli/test_batch_commands.py tests/test_services/test_batch_savings.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count]
    outputs:
      result_keys: [files_modified, test_count]
