schema_version: 1

feature:
  id: unify-content-workflows-agentic-surfaces
  title: Unified content workflows and agentic surfaces
  plan_revision: 1
  created_by: codex
  created_at: "2026-07-13T00:00:00Z"

contracts:
  revision: 1
  openapi:
    primary: openspec/changes/unify-content-workflows-agentic-surfaces/contracts/openapi/v1.yaml
    files:
      - openspec/changes/unify-content-workflows-agentic-surfaces/contracts/openapi/v1.yaml
  generated:
    pydantic_dir: openspec/changes/unify-content-workflows-agentic-surfaces/contracts/generated
    typescript_dir: openspec/changes/unify-content-workflows-agentic-surfaces/contracts/generated

defaults:
  priority: 5
  lock_ttl_minutes: 180
  timeout_minutes: 240
  retry_budget: 1
  verification_tier_required: A
  min_trust_level: 2

packages:
  - package_id: wp-contracts
    title: Contract validation and generation
    task_type: contracts
    description: Validate OpenAPI, database, event, and generated type contracts; add reproducible generation and drift gates.
    priority: 1
    depends_on: []
    inputs:
      task_ids: ["1.1", "1.2", "1.3"]
    locks:
      files:
        - openspec/changes/unify-content-workflows-agentic-surfaces/contracts/openapi/v1.yaml
        - openspec/changes/unify-content-workflows-agentic-surfaces/contracts/db/schema.sql
        - openspec/changes/unify-content-workflows-agentic-surfaces/contracts/events/operation.progress.schema.json
      keys:
        - contract:openapi/v1.yaml
        - contract:db/provenance
        - event:operation.progress
      ttl_minutes: 120
      reason: Freeze canonical coordination contracts before implementation.
    scope:
      write_allow:
        - openspec/changes/unify-content-workflows-agentic-surfaces/tasks.md
        - openspec/changes/unify-content-workflows-agentic-surfaces/change-context.md
        - openspec/changes/unify-content-workflows-agentic-surfaces/contracts/**
        - tests/contract/test_canonical_workflow_contracts.py
        - scripts/generate_workflow_contracts.py
        - Makefile
      read_allow: ["**"]
      deny: ["src/**", "web/**"]
    worktree: { name: wp-contracts, mode: isolated }
    timeout_minutes: 120
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: C
      steps:
        - name: contract-tests
          kind: command
          command: uv run pytest tests/contract/test_canonical_workflow_contracts.py --no-cov
          expect_exit_code: 0
          evidence:
            artifacts: [artifacts/wp-contracts/pytest.txt]
            result_keys: [test_count, pass_count]
    outputs:
      result_keys: [files_modified, contract_revision]

