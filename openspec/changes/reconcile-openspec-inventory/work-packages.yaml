schema_version: 1

feature:
  id: reconcile-openspec-inventory
  title: Reconcile the OpenSpec inventory
  plan_revision: 2
  created_by: codex
  created_at: "2026-07-23T21:30:00Z"

contracts:
  revision: 1
  openapi:
    primary: openspec/contracts/content-workflows/openapi/v1.yaml
    files:
      - openspec/contracts/content-workflows/openapi/v1.yaml

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 90
  retry_budget: 1
  verification_tier_required: B
  min_trust_level: 2

packages:
  - package_id: wp-implementation-audit
    title: Evidence-backed implementation audit
    task_type: verify
    description: Verify every archive disposition and publish the exact synchronization matrix.
    role: verification-engineer
    priority: 1
    depends_on: []
    locks:
      files: []
      keys:
        - feature:reconcile-openspec-inventory:audit
      ttl_minutes: 180
      reason: Read-only implementation and evidence classification.
    scope:
      write_allow:
        - openspec/changes/reconcile-openspec-inventory/evidence/**
      read_allow:
        - "**"
    worktree:
      name: wp-implementation-audit
      mode: shared
    timeout_minutes: 180
    retry_budget: 1
    min_trust_level: 2
    metadata:
      loc_estimate: 140
      alternatives_count: 2
      complexity: high
      package_kind: integration
    inputs:
      tasks: ["1.1", "1.2", "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "2.8"]
    verification:
      tier_required: B
      steps:
        - name: filtering-and-source-overrides
          kind: command
          command: pytest tests/config/test_filter_config.py tests/ingestion/test_filter_hook.py tests/services/test_ingestion_filter.py tests/config/test_source_overrides_e2e.py tests/config/test_source_overrides_merge.py tests/services/test_source_override_service.py tests/api/test_source_write_api.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts:
              - openspec/changes/reconcile-openspec-inventory/evidence/inventory-reconciliation.md
            result_keys: [test_count, pass_count]
        - name: huggingface-foundation
          kind: command
          command: pytest tests/test_ingestion/test_huggingface_papers.py tests/config/test_huggingface_papers_sources.py tests/ingestion/test_source_registry.py tests/contract/test_source_workflow_matrix.py tests/contract/test_canonical_workflow_contracts.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts:
              - openspec/changes/reconcile-openspec-inventory/evidence/inventory-reconciliation.md
            result_keys: [test_count, pass_count]
        - name: llm-evaluation-foundation
          kind: command
          command: pytest tests/config/test_routing_config.py tests/services/test_complexity_router.py tests/services/test_llm_router_routing.py tests/evaluation tests/services/test_evaluation_report.py tests/services/test_evaluation_service.py tests/cli/test_evaluate_commands.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts:
              - openspec/changes/reconcile-openspec-inventory/evidence/inventory-reconciliation.md
            result_keys: [test_count, pass_count]
        - name: profiles-and-mcp
          kind: command
          command: pytest tests/test_config/test_langfuse_profile_defaults.py tests/test_config/test_profile_templates.py tests/mcp/test_workflow_conformance.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts:
              - openspec/changes/reconcile-openspec-inventory/evidence/inventory-reconciliation.md
            result_keys: [test_count, pass_count]
        - name: completed-roadmap-items
          kind: command
          command: pytest tests/cli tests/clients/test_workflow_api_client.py tests/config/test_frontend_deployment.py tests/config/test_frontend_ci.py tests/config/test_frontend_deployment_evidence.py --no-cov -q -W default && python scripts/validate_frontend_deployment_evidence.py openspec/changes/restore-railway-frontend-deployment/evidence/production-deployment.md
          expect_exit_code: 0
          evidence:
            artifacts:
              - openspec/changes/repair-canonical-cli-transport-behavior/validation-report.md
              - openspec/changes/restore-railway-frontend-deployment/validation-report.md
            result_keys: [test_count, pass_count, evidence_complete]
    outputs:
      result_keys: [test_count, pass_count, dispositions, sync_matrix]

  - package_id: wp-focused-followups
    title: Focused residual changes
    task_type: docs
    description: Preserve genuine residual work as four bounded schema-valid successors.
    role: reliability-architect
    priority: 2
    depends_on:
      - wp-implementation-audit
    locks:
      files: []
      keys:
        - feature:reconcile-openspec-inventory:followups
      ttl_minutes: 120
      reason: New focused change identifiers and requirements.
    scope:
      write_allow:
        - openspec/changes/reconcile-ingestion-filtering-runtime-contract/**
        - openspec/changes/closeout-db-source-overrides-evidence/**
        - openspec/changes/operationalize-llm-evaluation-routing/**
        - openspec/changes/verify-production-paradedb-langfuse/**
      read_allow:
        - "**"
    worktree:
      name: wp-focused-followups
      mode: isolated
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    metadata:
      loc_estimate: 180
      alternatives_count: 3
      complexity: medium
      package_kind: config
    inputs:
      tasks: ["3.1", "3.2", "3.3", "3.4"]
    verification:
      tier_required: B
      steps:
        - name: focused-change-validation
          kind: command
          command: openspec validate reconcile-ingestion-filtering-runtime-contract --strict --no-interactive && openspec validate closeout-db-source-overrides-evidence --strict --no-interactive && openspec validate operationalize-llm-evaluation-routing --strict --no-interactive && openspec validate verify-production-paradedb-langfuse --strict --no-interactive
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [validated_changes]
    outputs:
      result_keys: [files_modified, validated_changes]

  - package_id: wp-retained-normalization
    title: Retained roadmap change normalization
    task_type: docs
    description: Add bounded delta requirements to actionable roadmap scaffolds that fail strict validation.
    role: spec-maintainer
    priority: 2
    depends_on:
      - wp-implementation-audit
      - wp-focused-followups
    locks:
      files: []
      keys:
        - feature:reconcile-openspec-inventory:retained
      ttl_minutes: 120
      reason: Strict-valid lifecycle state for retained roadmap work.
    scope:
      write_allow:
        - openspec/changes/add-cross-surface-release-smoke-tests/**
        - openspec/changes/establish-cli-gen-eval-coverage/**
        - openspec/changes/persisted-ingestion-run-results/**
        - openspec/changes/production-telemetry-and-out-of-band-alerting/**
        - openspec/changes/real-ingestion-test-tiers-in-ci/**
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/**
      read_allow:
        - openspec/roadmaps/workflow-surface-reliability/**
        - openspec/specs/**
        - openspec/contracts/**
        - openspec/changes/**
    worktree:
      name: wp-retained-normalization
      mode: isolated
    timeout_minutes: 90
    retry_budget: 1
    min_trust_level: 2
    metadata:
      loc_estimate: 100
      alternatives_count: 2
      complexity: low
      package_kind: config
    inputs:
      tasks: ["3.5"]
    verification:
      tier_required: B
      steps:
        - name: retained-change-validation
          kind: command
          command: openspec validate add-cross-surface-release-smoke-tests --strict --no-interactive && openspec validate establish-cli-gen-eval-coverage --strict --no-interactive && openspec validate persisted-ingestion-run-results --strict --no-interactive && openspec validate production-telemetry-and-out-of-band-alerting --strict --no-interactive && openspec validate real-ingestion-test-tiers-in-ci --strict --no-interactive && openspec validate stuck-content-sweeper-and-requeue-cli --strict --no-interactive
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [validated_changes]
    outputs:
      result_keys: [files_modified, validated_changes]

  - package_id: wp-spec-archive
    title: Manual specification merge and archival
    task_type: docs
    description: Merge only evidenced requirements, diff-review touched specs, and archive broad historical entries.
    role: spec-maintainer
    priority: 3
    depends_on:
      - wp-implementation-audit
      - wp-focused-followups
      - wp-retained-normalization
    locks:
      files: []
      keys:
        - feature:reconcile-openspec-inventory:archive
        - contract:openspec-archive
      ttl_minutes: 180
      reason: Serialize main-spec updates and dated archive destinations after successors exist.
    scope:
      write_allow:
        - openspec/specs/**
        - openspec/changes/add-ingestion-filtering-prioritization/**
        - openspec/changes/db-source-overrides/**
        - openspec/changes/add-huggingface-papers-source/**
        - openspec/changes/llm-router-evaluation/**
        - openspec/changes/use-paradedb-railway-langfuse-default/**
        - openspec/changes/unify-mcp-ingest-envelope/**
        - openspec/changes/repair-canonical-cli-transport-behavior/**
        - openspec/changes/restore-railway-frontend-deployment/**
        - openspec/changes/feynman-inspired-features/**
        - openspec/changes/archive/**
        - openspec/changes/reconcile-openspec-inventory/evidence/**
        - docs/GOTCHAS.md
        - docs/feature-discovery/opportunities.json
      read_allow:
        - "**"
    worktree:
      name: wp-spec-archive
      mode: shared
    timeout_minutes: 180
    retry_budget: 1
    min_trust_level: 2
    metadata:
      loc_estimate: 260
      alternatives_count: 2
      complexity: high
      package_kind: config
    inputs:
      tasks: ["4.1", "4.2", "4.3", "4.4", "4.5"]
    verification:
      tier_required: B
      steps:
        - name: touched-main-specs
          kind: command
          command: openspec validate ingestion-filtering --type spec --strict --no-interactive && openspec validate source-configuration --type spec --strict --no-interactive && openspec validate huggingface-papers-ingestion --type spec --strict --no-interactive && openspec validate llm-router-evaluation --type spec --strict --no-interactive && openspec validate profile-configuration --type spec --strict --no-interactive && openspec validate cli-interface --type spec --strict --no-interactive && openspec validate test-infrastructure --type spec --strict --no-interactive && openspec validate frontend-release-delivery --type spec --strict --no-interactive
          expect_exit_code: 0
          evidence:
            artifacts:
              - openspec/changes/reconcile-openspec-inventory/evidence/inventory-reconciliation.md
            result_keys: [validated_specs, archive_count]
        - name: archive-diff-review
          kind: command
          command: git diff --check
          expect_exit_code: 0
          evidence:
            artifacts:
              - openspec/changes/reconcile-openspec-inventory/evidence/inventory-reconciliation.md
            result_keys: [diff_clean, sync_matrix_complete]
    outputs:
      result_keys: [files_modified, validated_specs, archive_count, diff_clean]

  - package_id: wp-inventory-integration
    title: Final inventory proof
    task_type: integrate
    description: Validate the exact active set, successors, retained changes, touched specs, and evidence.
    role: integrator
    priority: 4
    depends_on:
      - wp-spec-archive
    locks:
      files:
        - scripts/validate_openspec_inventory.py
        - tests/openspec/test_inventory_reconciliation.py
      keys:
        - feature:reconcile-openspec-inventory:integration
      ttl_minutes: 180
      reason: Final pre-archive filesystem-to-snapshot invariant.
    scope:
      write_allow:
        - scripts/validate_openspec_inventory.py
        - tests/openspec/test_inventory_reconciliation.py
        - openspec/changes/reconcile-openspec-inventory/**
      read_allow:
        - "**"
    worktree:
      name: wp-inventory-integration
      mode: shared
    timeout_minutes: 180
    retry_budget: 0
    min_trust_level: 2
    metadata:
      loc_estimate: 140
      alternatives_count: 2
      complexity: medium
      package_kind: integration
    inputs:
      tasks: ["5.1", "5.2", "5.3"]
    verification:
      tier_required: A
      steps:
        - name: transitional-inventory
          kind: command
          command: pytest tests/openspec/test_inventory_reconciliation.py --no-cov -q && python scripts/validate_openspec_inventory.py openspec/changes/reconcile-openspec-inventory/evidence/inventory-dispositions.yaml --transitional
          expect_exit_code: 0
          evidence:
            artifacts:
              - openspec/changes/reconcile-openspec-inventory/evidence/inventory-dispositions.yaml
              - openspec/changes/reconcile-openspec-inventory/evidence/inventory-reconciliation.md
            result_keys: [test_count, active_count, archive_count]
        - name: active-change-validation
          kind: command
          command: openspec validate reconcile-openspec-inventory --strict --no-interactive && openspec validate reconcile-ingestion-filtering-runtime-contract --strict --no-interactive && openspec validate closeout-db-source-overrides-evidence --strict --no-interactive && openspec validate operationalize-llm-evaluation-routing --strict --no-interactive && openspec validate verify-production-paradedb-langfuse --strict --no-interactive && openspec validate add-cross-surface-release-smoke-tests --strict --no-interactive && openspec validate establish-cli-gen-eval-coverage --strict --no-interactive && openspec validate persisted-ingestion-run-results --strict --no-interactive && openspec validate production-telemetry-and-out-of-band-alerting --strict --no-interactive && openspec validate real-ingestion-test-tiers-in-ci --strict --no-interactive && openspec validate stuck-content-sweeper-and-requeue-cli --strict --no-interactive && openspec validate add-obsidian-vault-ingest --strict --no-interactive && openspec validate add-api-versioning --strict --no-interactive
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [validated_changes]
    outputs:
      result_keys: [files_modified, test_count, active_count, archive_count, validated_changes]

  - package_id: wp-self-archive
    title: Reconciliation self-archive
    task_type: integrate
    description: Sync inventory governance, archive RI-03, and verify the final snapshot from its dated destination.
    role: integrator
    priority: 5
    depends_on:
      - wp-inventory-integration
    locks:
      files: []
      keys:
        - feature:reconcile-openspec-inventory:selfarchive
        - contract:openspec-archive
      ttl_minutes: 120
      reason: Final lifecycle transition after all RI-03 evidence passes.
    scope:
      write_allow:
        - openspec/specs/openspec-inventory-governance/**
        - openspec/changes/reconcile-openspec-inventory/**
        - openspec/changes/archive/2026-07-23-reconcile-openspec-inventory/**
      read_allow:
        - "**"
    worktree:
      name: wp-self-archive
      mode: shared
    timeout_minutes: 90
    retry_budget: 0
    min_trust_level: 2
    metadata:
      loc_estimate: 20
      alternatives_count: 1
      complexity: low
      package_kind: integration
    inputs:
      tasks: ["5.4"]
    verification:
      tier_required: A
      steps:
        - name: final-inventory
          kind: command
          command: python scripts/validate_openspec_inventory.py openspec/changes/archive/2026-07-23-reconcile-openspec-inventory/evidence/inventory-dispositions.yaml --final && openspec validate openspec-inventory-governance --type spec --strict --no-interactive
          expect_exit_code: 0
          evidence:
            artifacts:
              - openspec/changes/archive/2026-07-23-reconcile-openspec-inventory/evidence/inventory-dispositions.yaml
            result_keys: [active_count, archive_count, governance_spec_valid]
    outputs:
      result_keys: [files_modified, active_count, archive_count, governance_spec_valid]
