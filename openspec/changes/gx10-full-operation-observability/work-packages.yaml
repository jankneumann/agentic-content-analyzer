          expect_exit_code: 0
          evidence:
            artifacts: ["artifacts/wp-queue-core/pytest.xml"]
            result_keys: ["test_count", "restart_passed", "retry_passed", "flush_passed"]
    inputs:
      task_ids: ["4.1", "4.2", "4.3", "4.4", "4.5"]
    outputs:
