schema_version: 1

feature:
  id: "gx10-full-operation-observability"
  title: "GX-10 full operation observability"
  plan_revision: 3
  created_by: "codex"
  created_at: "2026-08-28T12:00:00Z"

contracts:
  revision: 3
  openapi:
    primary: "openspec/changes/gx10-full-operation-observability/contracts/openapi/v1.yaml"
    files:
      - "openspec/changes/gx10-full-operation-observability/contracts/openapi/v1.yaml"
  generated:
    pydantic_dir: "openspec/changes/gx10-full-operation-observability/contracts/generated/python"
    typescript_dir: "openspec/changes/gx10-full-operation-observability/contracts/generated/typescript"

defaults:
  priority: 5
  lock_ttl_minutes: 120
  timeout_minutes: 90
  retry_budget: 1
  verification_tier_required: "A"
  min_trust_level: 2

packages:
  - package_id: "wp-contracts"
    title: "Freeze observability contracts"
    task_type: "contracts"
    description: "Freeze the all-operation entrypoint/provider inventory and validate the additive OpenAPI, SQL, event schemas, generated types, and workflow-model compatibility before implementation."
    role: "contract-engineer"
    priority: 1
    depends_on: []
    locks:
      files:
        - "openspec/changes/gx10-full-operation-observability/contracts/openapi/v1.yaml"
        - "openspec/contracts/content-workflows/openapi/v1.yaml"
        - "Makefile"
        - ".github/workflows/ci.yml"
        - "scripts/generate_workflow_contracts.py"
        - "src/contracts/workflow_models.py"
        - "web/src/generated/workflow-contracts.ts"
      keys:
        - "contract:gx10-operation-observability-v1"
      ttl_minutes: 120
      reason: "Freeze shared wire and type contracts"
    scope:
      write_allow:
        - "openspec/changes/gx10-full-operation-observability/contracts/**"
        - "openspec/contracts/content-workflows/openapi/v1.yaml"
        - "openspec/contracts/content-workflows/db/schema.sql"
        - "openspec/contracts/content-workflows/events/**"
        - "openspec/contracts/content-workflows/generated/**"
        - "src/contracts/workflow_models.py"
        - "web/src/generated/workflow-contracts.ts"
        - "Makefile"
        - "scripts/generate_workflow_contracts.py"
        - ".github/workflows/ci.yml"
        - "tests/contract/**"
      read_allow:
        - "openspec/**"
        - "src/contracts/**"
        - "tests/**"
      deny:
        - "src/frontend/**"
    worktree:
      name: "wp-contracts"
      mode: "isolated"
    timeout_minutes: 60
    retry_budget: 1
    min_trust_level: 2
    verification:
      tier_required: "C"
      steps:
        - name: "contract-validation"
          kind: "command"
          command: "make workflow-contracts-check && uv run pytest tests/contract -q --junitxml=artifacts/wp-contracts/pytest.xml && openspec validate gx10-full-operation-observability --strict"
          expect_exit_code: 0
          evidence:
            artifacts:
              - "artifacts/wp-contracts/pytest.xml"
            result_keys:
              - "openspec_valid"
              - "contract_drift_clean"
    inputs:
      task_ids: ["1.1", "1.2"]
    outputs:
      result_keys: ["files_modified", "contract_tests", "generated_types"]

  - package_id: "wp-db-projection"
    title: "Persist attempt correlation"
    task_type: "implement"
    description: "Implement the additive queue/context, attempt, process-health, audit/terminal correlation, inactive ownership, fencing, retention, and PostgreSQL contracts."
    role: "database-engineer"
    priority: 2
    depends_on: ["wp-contracts"]
    locks:
      files:
        - "src/queue/setup.py"
      keys:
        - "db:migration-slot"
        - "db:schema:operation_observation_attempts"
      ttl_minutes: 180
      reason: "Own additive operation observability schema"
    scope:
      write_allow:
        - "alembic/versions/**"
        - "src/queue/setup.py"
        - "src/repositories/operation_observation_attempts.py"
        - "src/repositories/telemetry_process_health.py"
        - "tests/queue/test_operation_observation_attempts.py"
        - "tests/integration/test_operation_observation_attempts.py"
      read_allow:
        - "src/**"
        - "tests/**"
        - "openspec/changes/gx10-full-operation-observability/contracts/**"
      deny:
        - "src/frontend/**"
    worktree:
      name: "wp-db-projection"
      mode: "isolated"
    timeout_minutes: 120
    retry_budget: 1
    min_trust_level: 3
    verification:
      tier_required: "A"
      steps:
        - name: "postgres-attempt-tests"
          kind: "command"
          command: "uv run pytest tests/queue/test_operation_observation_attempts.py tests/integration/test_operation_observation_attempts.py -q --junitxml=artifacts/wp-db-projection/pytest.xml"
          expect_exit_code: 0
          evidence:
            artifacts: ["artifacts/wp-db-projection/pytest.xml"]
            result_keys: ["test_count", "migration_roundtrip", "fencing_passed"]
    inputs:
      task_ids: ["2.1", "2.2", "2.3", "2.4", "2.5"]
    outputs:
      result_keys: ["files_modified", "test_count", "migration_revision"]

