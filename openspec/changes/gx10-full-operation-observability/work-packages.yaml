          expect_exit_code: 0
          evidence:
            artifacts: ["artifacts/wp-telemetry-context/pytest.xml"]
            result_keys: ["test_count", "canaries_absent", "trace_tree_valid"]
    inputs:
      task_ids: ["3.1", "3.2", "3.3", "3.4", "3.5"]
    outputs:
      result_keys: ["files_modified", "test_count", "masking_evidence"]

  - package_id: "wp-queue-core"
