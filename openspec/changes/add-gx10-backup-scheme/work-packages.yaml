      expect_exit_code: 0
      evidence:
        artifacts: []
        result_keys:
        - test_count
        - pass_count
  timeout_minutes: 180
  retry_budget: 1
  min_trust_level: 4
  outputs:
    result_keys:
    - files_modified
    - test_count
    - pass_count
- package_id: wp-deploy-assets
