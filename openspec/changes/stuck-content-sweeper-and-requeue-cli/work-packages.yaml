    task_type: implement
    description: >-
      Add tested claim-generation, transition-owner, Summary-provenance, and
      append-only action-audit persistence through Alembic, ORM, and bootstrap.
    role: database-engineer
    priority: 2
    depends_on: [wp-contracts]
    locks:
      files:
        - alembic/versions
        - openspec/contracts/content-workflows/db/schema.sql
        - src/models/content.py
        - src/models/summary.py
        - src/models/jobs.py
        - src/queue/setup.py
      keys:
        - db:migration-slot
        - db:schema:content_reconciliation_actions
        - feature:content-reconciliation:ownership
      ttl_minutes: 240
      reason: Additive durable ownership and audit schema boundary.
    scope:
      write_allow:
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/tasks.md
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/change-context.md
        - alembic/versions/**
        - openspec/contracts/content-workflows/db/schema.sql
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/contracts/db/schema.sql
        - src/models/content.py
        - src/models/summary.py
        - src/models/jobs.py
        - src/models/content_reconciliation.py
        - src/models/__init__.py
        - src/queue/setup.py
        - tests/migrations/**
        - tests/test_models/**
        - tests/test_queue/test_setup.py
      read_allow:
        - src/**
        - alembic/**
        - tests/**
        - openspec/**
    worktree: { name: wp-schema, mode: isolated }
    timeout_minutes: 240
    retry_budget: 1
    min_trust_level: 4
    metadata:
      loc_estimate: 480
      alternatives_count: 3
      complexity: high
      package_kind: migration
    inputs:
      tasks: ["2.1", "2.2"]
    verification:
      tier_required: A
      steps:
        - name: migration-bootstrap-tests
          kind: command
          command: .venv/bin/pytest tests/migrations tests/test_models tests/test_queue/test_setup.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count, upgrade_downgrade_cases, constraint_cases]
    outputs:
      result_keys: [files_modified, test_count, upgrade_downgrade_cases, constraint_cases]

  - package_id: wp-fence
