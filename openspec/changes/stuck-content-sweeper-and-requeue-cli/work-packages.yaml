          command: .venv/bin/pytest tests/queue/test_operation_service.py tests/queue/test_worker_extended.py tests/queue/test_operation_controls.py tests/test_queue/test_setup.py tests/integration/test_operation_retention.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count, budget_races, lock_order_cases]
    outputs:
      result_keys: [files_modified, test_count, budget_races, lock_order_cases]

  - package_id: wp-reconciliation
    title: Bounded reconciliation engine
    task_type: implement
