        - feature:content-reconciliation:apply
        - feature:content-reconciliation:index
      ttl_minutes: 300
      reason: Reconciliation rules, mutations, audits, and query-plan ownership.
    scope:
      write_allow:
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/tasks.md
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/change-context.md
