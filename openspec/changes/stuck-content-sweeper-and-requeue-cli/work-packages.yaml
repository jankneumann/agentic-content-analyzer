schema_version: 1

feature:
  id: stuck-content-sweeper-and-requeue-cli
  title: Reconcile stuck content states
  plan_revision: 3
  created_by: codex
  created_at: "2026-08-01T21:00:00Z"

contracts:
  revision: 3
  openapi:
    primary: openspec/contracts/content-workflows/openapi/v1.yaml
    files:
      - openspec/contracts/content-workflows/openapi/v1.yaml
      - openspec/changes/stuck-content-sweeper-and-requeue-cli/contracts/reconciliation-report.schema.json
  generated:
    pydantic_dir: src/contracts
    typescript_dir: web/src/generated

defaults:
  priority: 5
  lock_ttl_minutes: 180
  timeout_minutes: 180
  retry_budget: 1
  verification_tier_required: B
  min_trust_level: 3

packages:
  - package_id: wp-contracts
    title: Reconciliation wire contracts plus policy
    task_type: implement
    description: >-
      Test and add the closed request/report schemas, generated models, and
      default-off bounded reconciliation settings.
    role: contract-engineer
    priority: 1
    depends_on: []
    locks:
      files:
        - openspec/contracts/content-workflows/openapi/v1.yaml
        - openspec/contracts/content-workflows/generated/models.py
        - openspec/contracts/content-workflows/generated/types.ts
        - src/contracts/workflow_models.py
        - web/src/generated/workflow-contracts.ts
        - src/config/settings.py
      keys:
        - contract:content-workflows:content-reconciliation
        - env:content-reconciliation-policy
      ttl_minutes: 180
      reason: Canonical wire schema, generated output, and bounded policy ownership.
    scope:
      write_allow:
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/tasks.md
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/change-context.md
        - openspec/contracts/content-workflows/openapi/v1.yaml
        - openspec/contracts/content-workflows/generated/**
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/contracts/reconciliation-report.schema.json
        - src/contracts/**
        - web/src/generated/**
        - scripts/generate_workflow_contracts.py
        - src/config/settings.py
        - tests/contract/test_canonical_workflow_contracts.py
        - tests/config/test_settings.py
      read_allow:
        - src/**
        - web/**
        - tests/**
        - openspec/**
    worktree: { name: wp-contracts, mode: isolated }
    timeout_minutes: 180
    retry_budget: 1
    min_trust_level: 3
    metadata:
      loc_estimate: 360
      alternatives_count: 3
      complexity: medium
      package_kind: data_model
    inputs:
      tasks: ["1.1", "1.2", "1.3", "1.4"]
    verification:
      tier_required: B
      steps:
        - name: contract-drift
          kind: command
          command: make workflow-contracts-check
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [contract_valid, generated_models_current]
        - name: contract-settings-tests
          kind: command
          command: .venv/bin/pytest tests/contract/test_canonical_workflow_contracts.py tests/config/test_settings.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count]
    outputs:
      result_keys: [files_modified, contract_valid, generated_models_current]

  - package_id: wp-schema
