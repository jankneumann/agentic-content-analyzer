      commits, and transaction advisory locking at the domain boundary.
    role: concurrency-engineer
    priority: 3
    depends_on: [wp-retry]
    locks:
      files:
        - src/queue/worker.py
        - src/queue/execution_claim.py
        - src/queue/workflow_handlers.py
        - src/models/content.py
        - src/services/url_extractor.py
        - src/processors/summarizer.py
        - src/ingestion/orchestrator.py
      keys:
        - feature:content-reconciliation:fence
      ttl_minutes: 240
      reason: Durable attempt fencing and supported transition ownership.
    scope:
      write_allow:
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/tasks.md
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/change-context.md
        - src/queue/worker.py
        - src/queue/execution_claim.py
        - src/queue/content_execution_lock.py
        - src/queue/workflow_handlers.py
        - src/queue/setup.py
        - src/models/content.py
        - src/services/url_extractor.py
        - src/processors/summarizer.py
        - src/ingestion/orchestrator.py
        - tests/queue/test_worker_extended.py
        - tests/queue/test_operation_controls.py
        - tests/integration/test_content_reconciliation_concurrency.py
        - tests/integration/test_summarization_workflow.py
        - tests/test_services/test_url_extractor.py
        - tests/test_processors/test_summarizer.py
        - tests/test_models/test_content.py
      read_allow:
        - src/**
        - tests/**
        - openspec/**
    worktree: { name: wp-fence, mode: isolated }
    timeout_minutes: 300
    retry_budget: 1
    min_trust_level: 4
    metadata:
      loc_estimate: 760
      alternatives_count: 3
      complexity: high
      package_kind: algorithm
    inputs:
      tasks: ["3.3", "3.4", "3.5", "3.6", "3.7"]
    verification:
      tier_required: A
      steps:
        - name: fence-postgres-tests
          kind: command
          command: .venv/bin/pytest tests/integration/test_content_reconciliation_concurrency.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count, generation_races, superseded_commit_cases]
        - name: writer-worker-tests
          kind: command
          command: .venv/bin/pytest tests/queue/test_worker_extended.py tests/queue/test_operation_controls.py tests/test_services/test_url_extractor.py tests/test_processors/test_summarizer.py tests/integration/test_summarization_workflow.py tests/test_models/test_content.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count]
    outputs:
      result_keys: [files_modified, test_count, generation_races, superseded_commit_cases]

  - package_id: wp-retry
    title: Generation-guarded operation lifecycle
    task_type: implement
    description: >-
      Guard worker and OperationService lifecycle writes by generation, enforce
