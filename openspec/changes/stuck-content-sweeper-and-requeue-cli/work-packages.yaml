      connection-scoped primitive with optional atomic reconciliation ceilings.
    role: concurrency-engineer
    priority: 3
    depends_on: [wp-schema]
    locks:
      files:
        - src/services/operation_service.py
        - src/queue/worker.py
        - src/queue/setup.py
        - src/queue/execution_claim.py
      keys:
        - feature:operation-retry:budget
      ttl_minutes: 180
      reason: Canonical graph-lock, retry-count, and notification ownership.
    scope:
      write_allow:
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/tasks.md
        - openspec/changes/stuck-content-sweeper-and-requeue-cli/change-context.md
        - src/services/operation_service.py
        - src/queue/worker.py
        - src/queue/setup.py
        - src/queue/execution_claim.py
        - tests/queue/test_operation_service.py
        - tests/queue/test_worker_extended.py
        - tests/queue/test_operation_controls.py
        - tests/test_queue/test_setup.py
        - tests/integration/test_operation_retention.py
      read_allow:
        - src/**
        - tests/**
        - openspec/**
    worktree: { name: wp-retry, mode: isolated }
    timeout_minutes: 180
    retry_budget: 1
    min_trust_level: 4
    metadata:
      loc_estimate: 280
      alternatives_count: 3
      complexity: high
      package_kind: algorithm
    inputs:
      tasks: ["3.1", "3.2", "4.1", "4.2"]
