      Merge the approved versioned result, pipeline summary, operation summary,
      and ingestion-history schemas into the durable registry, extend both
      generators, and record the reconciliation matrix.
    role: contract-engineer
    priority: 1
    depends_on: []
    locks:
      files:
        - openspec/contracts/content-workflows/openapi/v1.yaml
        - openspec/contracts/content-workflows/generated/models.py
        - openspec/contracts/content-workflows/generated/types.ts
        - src/contracts/workflow_models.py
        - web/src/generated/workflow-contracts.ts
      keys:
        - contract:content-workflows:ingestion-history
      ttl_minutes: 180
      reason: Canonical cross-surface schema and generated-model ownership.
    scope:
      write_allow:
        - openspec/contracts/content-workflows/**
        - src/contracts/**
        - web/src/generated/**
        - scripts/generate_workflow_contracts.py
        - tests/contract/test_canonical_workflow_contracts.py
        - openspec/changes/persisted-ingestion-run-results/reconciliation.md
      read_allow:
        - src/**
        - web/**
        - tests/**
        - openspec/**
    worktree: { name: wp-contracts, mode: isolated }
    timeout_minutes: 180
    retry_budget: 1
    min_trust_level: 2
    metadata:
      loc_estimate: 420
      alternatives_count: 3
      complexity: high
      package_kind: data_model
    inputs:
      tasks: ["1.1", "1.2", "1.3"]
    verification:
      tier_required: B
      steps:
        - name: workflow-contract-drift
          kind: command
          command: make workflow-contracts-check
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [contract_valid, generated_models_current]
        - name: contract-tests
          kind: command
          command: .venv/bin/pytest tests/contract/test_canonical_workflow_contracts.py --no-cov -q
          expect_exit_code: 0
          evidence:
            artifacts: []
            result_keys: [test_count, pass_count]
    outputs:
      result_keys: [files_modified, contract_valid, generated_models_current]

