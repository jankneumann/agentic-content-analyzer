        - env:configured_source_key_secret
      ttl_minutes: 240
      reason: Ingestion result, configured identity, and redaction boundary.
    scope:
      write_allow:
        - src/ingestion/**
        - src/queue/workflow_handlers.py
        - src/config/sources.py
        - src/config/settings.py
        - src/services/capability_service.py
        - tests/ingestion/**
        - tests/queue/test_workflow_handlers.py
        - tests/services/test_capability_service.py
        - tests/config/test_settings.py
      read_allow:
        - src/**
        - tests/**
        - openspec/**
    worktree: { name: wp-results, mode: isolated }
    timeout_minutes: 240
    retry_budget: 1
    min_trust_level: 3
    metadata:
      loc_estimate: 520
      alternatives_count: 3
      complexity: high
      package_kind: data_model
    inputs:
      tasks: ["2.1", "2.2", "2.3", "2.4"]
