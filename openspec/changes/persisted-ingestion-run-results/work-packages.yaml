schema_version: 1

feature:
  id: persisted-ingestion-run-results
  title: Reconcile persisted ingestion results
  plan_revision: 3
  created_by: codex
  created_at: "2026-07-28T00:30:00Z"

contracts:
  revision: 1
  openapi:
